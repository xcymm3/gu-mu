name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "app/**"
      - "features/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "tokens.css"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "scripts/verify-android-apk.ps1"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      # The Android export does not need Electron's desktop binary/postinstall.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Build full offline game and test APK
        run: pnpm android:pack
      - name: Verify packaged game assets and signature
        shell: pwsh
        run: ./scripts/verify-android-apk.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xue-gu-yin-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
